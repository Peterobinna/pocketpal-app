# Docker Compose helps us run the frontend and backend together
# with one command: docker compose up --build

services:
  # Backend service for the Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-run

    container_name: pocketpal-backend

    ports:
      - "5000:5000"

    environment:
      - NODE_ENV=production
      - PORT=5000

    networks:
      - pocketpal-network

    restart: unless-stopped

  # Frontend service for the React/Vite app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-run
      args:
        # This URL is built into the Vite frontend during Docker build
        - VITE_API_URL=http://localhost:5000

    container_name: pocketpal-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - pocketpal-network

    restart: unless-stopped

# Shared network so containers can communicate
networks:
  pocketpal-network:
    driver: bridge
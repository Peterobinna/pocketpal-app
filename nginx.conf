server {
    # Keep the existing frontend port expected by Terraform,
    # Docker Compose and the Application Load Balancer.
    listen 5173;
    listen [::]:5173;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not expose the Nginx version in response headers.
    server_tokens off;

    # Basic response security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache immutable frontend assets.
    location /assets/ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React is a single-page application. Unknown frontend routes
    # should return index.html so browser refreshes continue to work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# PocketPal Continuous Integration Pipeline
# This workflow checks code quality, runs tests, and builds Docker images.

name: PocketPal CI

on:
  # Run CI when code is pushed to any branch except main
  push:
    branches-ignore:
      - main

  # Run CI when a pull request is opened against main
  pull_request:
    branches:
      - main

jobs:
  ci-checks:
    name: Lint, Test, and Docker Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code into the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js for frontend and backend tasks
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install frontend dependencies
      - name: Install frontend dependencies
        run: npm install

      # Step 4: Run frontend linting
      # If linting fails, the pipeline fails.
      - name: Run frontend lint
        run: npm run lint

      # Step 5: Run frontend tests
      # If tests fail, the pipeline fails.
      - name: Run frontend tests
        run: npm test

      # Step 6: Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./server
        run: npm install

      # Step 7: Run backend tests
      # If backend tests fail, the pipeline fails.
      # NOTE: requires server/vitest.config.js (added alongside this workflow fix) so
      # Vitest doesn't inherit the root config's "exclude: server/**" and silently
      # report "no test files found".
      - name: Run backend tests
        working-directory: ./server
        run: npm test

      # Step 8: Dependency vulnerability scan (frontend)
      # Fails the pipeline on high or critical severity advisories.
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      # Step 9: Dependency vulnerability scan (backend)
      # Fails the pipeline on high or critical severity advisories.
      - name: Audit backend dependencies
        working-directory: ./server
        run: npm audit --audit-level=high

      # Step 10: Build backend Docker image
      # If Docker build fails, the pipeline fails.
      - name: Build backend Docker image
        run: docker build --target backend-run -t pocketpal-backend .

      # Step 11: Build frontend Docker image
      # If Docker build fails, the pipeline fails.
      - name: Build frontend Docker image
        run: docker build --target frontend-run -t pocketpal-frontend .

      # Step 12: Scan built container images for known vulnerabilities
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: pocketpal-backend
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: pocketpal-frontend
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Step 13: Scan Terraform for misconfigurations
      - name: Checkov scan (Terraform)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
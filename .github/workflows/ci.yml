name: PocketPal CI and Security

on:
  pull_request:
    branches:
      - main
      - summative-integration

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketpal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application Quality and Container Security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Scan frontend dependencies
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run backend tests
        working-directory: server
        run: npm test

      - name: Scan backend dependencies
        working-directory: server
        run: npm audit --audit-level=high

      - name: Build frontend Docker image
        run: |
          docker build \
            --target frontend-run \
            --build-arg VITE_API_URL="" \
            --tag pocketpal-frontend:ci \
            .

      - name: Build backend Docker image
        run: |
          docker build \
            --target backend-run \
            --tag pocketpal-backend:ci \
            .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pocketpal-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pocketpal-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infrastructure:
    name: Terraform and Ansible Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialise Terraform without remote backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          output_format: cli
          quiet: false

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible syntax check
        run: |
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory.ini.example \
            ansible/playbook.yml

---
# Application identity and deployment directory.
app_name: pocketpal
app_directory: /opt/pocketpal
app_user: ubuntu
app_group: ubuntu

# AWS settings.
aws_region: us-east-1

# Network ranges and service ports.
vpc_cidr: "10.0.0.0/16"
ssh_port: 22
frontend_port: 5173
backend_port: 5000

# Deployment values supplied by the CD workflow.
ecr_registry: ""
image_tag: "latest"

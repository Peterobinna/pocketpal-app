---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH from the VPC
  community.general.ufw:
    rule: allow
    src: "10.0.0.0/16"
    port: "22"
    proto: tcp

- name: Allow frontend traffic from the VPC
  community.general.ufw:
    rule: allow
    src: "10.0.0.0/16"
    port: "5173"
    proto: tcp

- name: Allow backend traffic from the VPC
  community.general.ufw:
    rule: allow
    src: "10.0.0.0/16"
    port: "5000"
    proto: tcp

- name: Deny root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny

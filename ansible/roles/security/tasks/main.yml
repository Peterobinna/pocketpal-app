---
- name: Install UFW firewall
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow SSH from the private VPC network
  community.general.ufw:
    rule: allow
    src: "{{ vpc_cidr }}"
    port: "{{ ssh_port | string }}"
    proto: tcp
    comment: Allow SSH through the bastion host

- name: Allow frontend traffic from the load balancer network
  community.general.ufw:
    rule: allow
    src: "{{ vpc_cidr }}"
    port: "{{ frontend_port | string }}"
    proto: tcp
    comment: Allow PocketPal frontend traffic

- name: Allow backend traffic from the load balancer network
  community.general.ufw:
    rule: allow
    src: "{{ vpc_cidr }}"
    port: "{{ backend_port | string }}"
    proto: tcp
    comment: Allow PocketPal backend traffic

- name: Disable direct root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    create: false
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    create: false
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Enable SSH public-key authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PubkeyAuthentication\s+'
    line: 'PubkeyAuthentication yes'
    create: false
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Disable empty-password SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PermitEmptyPasswords\s+'
    line: 'PermitEmptyPasswords no'
    create: false
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Enable UFW with default-deny incoming policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

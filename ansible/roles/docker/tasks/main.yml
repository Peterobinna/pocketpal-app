---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker, Compose and required packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3
      - python3-pip
      - python3-docker
      - awscli
      - curl
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add Ubuntu user to Docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
